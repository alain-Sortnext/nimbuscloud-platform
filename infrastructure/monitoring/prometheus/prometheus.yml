# NimbusCloud Platform — Prometheus Configuration
# ✅ FIXED: All 5 scrape targets configured

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    region: 'eu-west-2'
    platform: 'nimbuscloud'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rules files
rule_files: []

# ==========================================
# SCRAPE CONFIGURATIONS — 5 TARGETS
# ==========================================
scrape_configs:
  # TARGET 1: Prometheus Self-Scrape (Port 9090)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 10s
    metrics_path: /metrics

  # TARGET 2: Auth Service (Port 3003)
  - job_name: 'auth-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['default']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: auth-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '3003'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:3003
    metrics_path: /metrics
    scrape_interval: 15s

  # TARGET 3: Booking API (Port 3001)
  - job_name: 'booking-api'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['default']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: booking-api
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '3001'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:3001
    metrics_path: /metrics
    scrape_interval: 15s

  # TARGET 4: Payment API (Port 3002)
  - job_name: 'payment-api'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['default']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: payment-api
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '3002'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:3002
    metrics_path: /metrics
    scrape_interval: 15s

  # TARGET 5: Notification Service (Port 3004)
  - job_name: 'notification-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['default']
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: notification-service
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '3004'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:3004
    metrics_path: /metrics
    scrape_interval: 15s