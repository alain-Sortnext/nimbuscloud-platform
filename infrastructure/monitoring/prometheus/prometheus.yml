# NimbusCloud Platform - Prometheus Configuration
# Phase 6 - Monitoring Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    region: 'eu-west-2'
    platform: 'nimbuscloud'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'booking-api'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['booking-api:3001']

  - job_name: 'payment-api'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['payment-api:3002']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['auth-service:3003']

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['notification-service:3004']

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
